<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E9E2D0">
<title>でたらめくん - kubearma</title>
<style>
@font-face{font-family:"GenEi";src:url("https://raw.githubusercontent.com/niyaaari/part-time-pay-calculator/main/fonts/GenEiMGothic2-Regular.ttf");font-weight:400}
@font-face{font-family:"GenEi";src:url("https://raw.githubusercontent.com/niyaaari/part-time-pay-calculator/main/fonts/GenEiMGothic2-Medium.ttf");font-weight:500}
@font-face{font-family:"GenEi";src:url("https://raw.githubusercontent.com/niyaaari/part-time-pay-calculator/main/fonts/GenEiMGothic2-Bold.ttf");font-weight:700}
:root{color-scheme:light;--bg:#E9E2D0;--ink:#6C4732;--muted:#806a5c;--panel:rgba(255,255,255,.24);--line:rgba(108,71,50,.25);--accent:#6C4732;--deco:#6C4732;--red:#df5555;--blue:#438edb;--shadow:none}
:root[data-theme="dark"]{color-scheme:dark;--bg:#171b25;--ink:#e7e9ee;--muted:#a5aab5;--panel:rgba(43,46,56,.76);--line:rgba(255,255,255,.12);--accent:#91aaff;--deco:#596170;--shadow:0 14px 38px rgba(0,0,0,.22)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:24px 16px 32px;background:var(--bg);color:var(--ink);font-family:GenEi,"Yu Gothic",sans-serif;transition:background .25s,color .25s}
main{width:min(760px,100%);margin:auto}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
.brand{display:inline-flex;align-items:center;gap:6px;color:inherit;text-decoration:none;font-size:14px;font-weight:700;letter-spacing:.04em}
.brand svg{width:17px;height:17px}
.theme-toggle{width:32px;height:32px;border:1px solid var(--line);border-radius:50%;background:var(--panel);color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:transform .2s,background .25s}
.theme-toggle:active{transform:scale(.92)}.theme-toggle svg{width:16px;height:16px}
h1{font-size:clamp(28px,6vw,36px);text-align:center;margin:0;font-weight:700;letter-spacing:.06em}
.subtitle{text-align:center;color:var(--muted);font-size:13px;margin:8px 0 26px}
.game-card{position:relative;isolation:isolate;padding:22px 18px 20px;margin:0 0 18px}
.game-card:before,.game-card:after{content:"";position:absolute;z-index:-1;pointer-events:none;transition:all .3s}
.game-card:before{inset:-5px 0;border-left:2px solid var(--deco);border-right:2px solid var(--deco)}
.game-card:after{inset:0 -5px;border-top:2px solid var(--deco);border-bottom:2px solid var(--deco)}
.score-row{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 20px}
.score-label{font-size:11px;color:var(--muted);letter-spacing:.16em}
.score{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.lane-wrap{position:relative;height:100px;margin:0 0 18px;overflow:hidden;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.lane{position:absolute;inset:0}
.judge-line{position:absolute;left:19%;top:10px;bottom:10px;width:4px;border-radius:5px;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 12%,transparent)}
.judge-label{position:absolute;left:19%;top:4px;transform:translateX(-50%);font-size:10px;color:var(--muted);z-index:2}
.note{position:absolute;top:50%;width:27px;height:27px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:inset 0 2px 3px #ffffff55,0 2px 5px #0002}
.note.don{background:var(--red)}.note.ka{background:var(--blue)}
.lane-hint{position:absolute;right:10px;bottom:7px;font-size:10px;color:var(--muted)}
.drum-area{display:flex;justify-content:center;padding:4px 0 2px}
.drum{width:min(290px,78vw);aspect-ratio:1;border-radius:50%;border:7px solid color-mix(in srgb,var(--ink) 88%,#000);background:color-mix(in srgb,var(--bg) 86%,white);box-shadow:inset 0 0 0 5px color-mix(in srgb,var(--ink) 12%,transparent),0 8px 18px #0002;display:grid;grid-template-columns:1fr 1fr;overflow:hidden;position:relative;touch-action:manipulation;user-select:none}
:root[data-theme="dark"] .drum{background:#252b38;border-color:#aeb4c0}
.drum-hit{border:0;background:transparent;color:var(--ink);font:inherit;font-size:clamp(18px,5vw,24px);font-weight:700;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;cursor:pointer;transition:background .12s,transform .12s}
.drum-hit+ .drum-hit{border-left:2px dashed color-mix(in srgb,var(--ink) 22%,transparent)}
.drum-hit:active,.drum-hit.pressed{background:color-mix(in srgb,var(--ink) 12%,transparent);transform:scale(.97)}
.drum-hit small{font-size:11px;color:var(--muted);font-weight:500}
.drum-hit.don{color:var(--red)}.drum-hit.ka{color:var(--blue)}
.drum-caption{text-align:center;color:var(--muted);font-size:11px;margin-top:12px}
.controls{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:20px}
.action{border:1px solid var(--line);border-radius:10px;padding:12px 22px;background:var(--panel);color:var(--ink);font:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:transform .15s,background .2s}
.action:active{transform:scale(.97)}.action.primary{background:var(--accent);border-color:var(--accent);color:#fff;min-width:160px}
.message{text-align:center;min-height:24px;margin:16px 0 0;font-size:13px;color:var(--muted)}
.result{display:none;text-align:center;padding:10px 0 0}.result.show{display:block;animation:reveal .25s ease both}
.result-score{font-size:clamp(42px,10vw,58px);font-weight:700;line-height:1.2;margin:4px 0 12px;font-variant-numeric:tabular-nums}
.result-caption{font-size:12px;color:var(--muted)}
.help{text-align:center;color:var(--muted);font-size:11px;line-height:1.9;margin:22px 0 0}
.keycap{display:inline-block;min-width:23px;padding:1px 5px;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--ink);font-size:10px;font-weight:700}
footer{text-align:center;color:var(--muted);font-size:11px;margin-top:36px}
@keyframes reveal{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:420px){body{padding:18px 14px 26px}.game-card{padding:18px 12px}.lane-wrap{height:88px}.drum{border-width:6px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main>
<header class="topbar">
<a class="brand" href="https://niyaaari.github.io/"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.58 9.99a.27.27 0 0 0-.29-.36l-5.06.72a.27.27 0 0 0-.16.46l3.6 3.72a.27.27 0 0 0 .45-.11zM6.75 20.39a.27.27 0 0 0 .37.32l4.73-2.24a.27.27 0 0 1 .22 0l4.94 2.24a.27.27 0 0 0 .36-.33c-.93-2.81-1.77-5.58-2.67-8.38a.27.27 0 0 0-.48-.06l-2 3.58a.27.27 0 0 1-.23.14h-.09a.26.26 0 0 1-.23-.15z"/></svg>くま</a>
<button class="theme-toggle" id="themeToggle" aria-label="テーマを切り替え"><svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg></button>
</header>
<h1>でたらめくん</h1>
<p class="subtitle">流れてくる音符に合わせて、太鼓を叩こう。</p>
<section class="game-card">
<div class="score-row"><span class="score-label">COMBO</span><span class="score" id="combo">0</span></div>
<div class="lane-wrap" id="laneWrap" aria-label="音符レーン">
<div class="lane" id="lane"><span class="judge-label">判定</span><span class="judge-line"></span></div>
<span class="lane-hint">← 音符が流れてくる</span>
</div>
<div class="drum-area">
<div class="drum" aria-label="太鼓">
<button class="drum-hit don" id="donButton" type="button"><span>ドン</span><small>F / J</small></button>
<button class="drum-hit ka" id="kaButton" type="button"><span>カッ</span><small>D / K</small></button>
</div>
</div>
<div class="drum-caption">赤い音符はドン、青い音符はカッ</div>
<div class="controls" id="startControls"><button class="action primary" id="startButton">ゲームスタート</button></div>
<div class="message" id="message" aria-live="polite">スタートすると音符が流れ始めるよ。</div>
<div class="result" id="result">
<div class="result-caption">今回のスコア</div><div class="result-score" id="finalScore">0</div><div class="result-caption">COMBO</div>
<div class="controls"><button class="action primary" id="retryButton">もう一度プレイ</button></div>
</div>
</section>
<p class="help">キーボード：ドン <span class="keycap">F</span> <span class="keycap">J</span> ／ カッ <span class="keycap">D</span> <span class="keycap">K</span><br>音符が判定ラインに来たタイミングで叩こう。1回でもミスするとゲーム終了！</p>
<footer>© kubearma</footer>
</main>
<script>
const root=document.documentElement;
const themeButton=document.getElementById('themeToggle');
const savedTheme=localStorage.getItem('pantaro_theme')||'light';
if(savedTheme==='dark')root.dataset.theme='dark';
function updateThemeIcon(){const dark=root.dataset.theme==='dark';themeButton.setAttribute('aria-pressed',String(dark));themeButton.innerHTML=dark?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5Z"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>'}
updateThemeIcon();
themeButton.addEventListener('click',()=>{root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';localStorage.setItem('pantaro_theme',root.dataset.theme);updateThemeIcon()});
const lane=document.getElementById('lane'),comboEl=document.getElementById('combo'),message=document.getElementById('message');
const startControls=document.getElementById('startControls'),result=document.getElementById('result');
const startButton=document.getElementById('startButton'),retryButton=document.getElementById('retryButton');
const donButton=document.getElementById('donButton'),kaButton=document.getElementById('kaButton');
let running=false,combo=0,notes=[],spawnTimer=null,raf=0,lastFrame=0,lastSpawn=0,interval=330,travel=1900,gameStart=0;
const HIT_WINDOW=125;
function setMessage(text){message.textContent=text}
function clearNotes(){notes.forEach(n=>n.el.remove());notes=[]}
function reset(){running=false;cancelAnimationFrame(raf);clearTimeout(spawnTimer);clearNotes();combo=0;comboEl.textContent='0';result.classList.remove('show');startControls.hidden=false;setMessage('スタートすると音符が流れ始めるよ。')}
function start(){reset();running=true;startControls.hidden=true;result.classList.remove('show');combo=0;comboEl.textContent='0';interval=330;travel=1900;gameStart=performance.now();lastSpawn=gameStart;lastFrame=gameStart;setMessage('');spawnNote(gameStart);raf=requestAnimationFrame(frame)}
function spawnNote(now){const type=Math.random()<.5?'don':'ka';const el=document.createElement('span');el.className='note '+type;lane.appendChild(el);notes.push({type,el,born:now,hit:false});}
function frame(now){if(!running)return;const elapsed=now-gameStart;const progress=Math.min(1,elapsed/90000);const currentTravel=Math.max(1050,travel-progress*620);const currentInterval=Math.max(125,interval-progress*155);
if(now-lastSpawn>=currentInterval){spawnNote(now);lastSpawn=now}
const lineX=lane.clientWidth*.19;const width=lane.clientWidth;
for(const n of notes){const age=now-n.born;const x=width+10-(age/currentTravel)*(width-lineX+18);n.el.style.left=x+'px';if(!n.hit&&age>currentTravel+HIT_WINDOW){finish(false,'音符を見逃した！');return}}
notes=notes.filter(n=>{if(n.hit){n.el.remove();return false}return true});
raf=requestAnimationFrame(frame)}
function hit(type){if(!running)return;const now=performance.now();const travelNow=Math.max(1050,travel-Math.min(1,(now-gameStart)/90000)*620);const lineX=lane.clientWidth*.19;const width=lane.clientWidth;
let candidate=null,best=Infinity;
for(const n of notes){if(n.hit)continue;const age=now-n.born;const x=width+10-(age/travelNow)*(width-lineX+18);const distance=Math.abs(x-lineX);if(distance<best){best=distance;candidate=n}}
if(!candidate||best>Math.max(24,lane.clientWidth*.055)||candidate.type!==type){finish(false,candidate&&best<=Math.max(24,lane.clientWidth*.055)?'違う種類の音符を叩いた！':'タイミングが合わなかった！');return}
candidate.hit=true;combo++;comboEl.textContent=String(combo);const button=type==='don'?donButton:kaButton;button.classList.add('pressed');setTimeout(()=>button.classList.remove('pressed'),90)}
function finish(success,reason){if(!running)return;running=false;cancelAnimationFrame(raf);clearTimeout(spawnTimer);clearNotes();document.getElementById('finalScore').textContent=String(combo);startControls.hidden=true;result.classList.add('show');setMessage(reason||'ゲーム終了！');}
function press(type){hit(type)}
donButton.addEventListener('pointerdown',e=>{e.preventDefault();press('don')});
kaButton.addEventListener('pointerdown',e=>{e.preventDefault();press('ka')});
startButton.addEventListener('click',start);retryButton.addEventListener('click',start);
document.addEventListener('keydown',e=>{if(e.repeat)return;const key=e.key.toLowerCase();if(key==='f'||key==='j'){e.preventDefault();press('don')}else if(key==='d'||key==='k'){e.preventDefault();press('ka')}else if((key===' '||key==='enter')&&!running&&result.classList.contains('show')){e.preventDefault();start()}});
reset();
</script>
</body>
</html>
