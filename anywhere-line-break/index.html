<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#E9E2D0">
<meta name="description" content="文章の改行位置を特殊文字に変換。どこでも改行くんで簡単に変換・コピーできます。">
<meta property="og:title" content="どこでも改行くん | kubearma">
<meta property="og:description" content="改行したい位置を特殊文字に変換します。">
<title>どこでも改行くん | kubearma</title>
<style>
@font-face{font-family:GenEi;src:url("https://raw.githubusercontent.com/niyaaari/part-time-pay-calculator/main/fonts/GenEiMGothic2-Regular.ttf") format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:GenEi;src:url("https://raw.githubusercontent.com/niyaaari/part-time-pay-calculator/main/fonts/GenEiMGothic2-Medium.ttf") format("truetype");font-weight:500;font-display:swap}
@font-face{font-family:GenEi;src:url("https://raw.githubusercontent.com/niyaaari/part-time-pay-calculator/main/fonts/GenEiMGothic2-Bold.ttf") format("truetype");font-weight:700;font-display:swap}
:root{color-scheme:light;--bg:#E9E2D0;--ink:#6C4732;--muted:#806a5c;--line:rgba(108,71,50,.22);--accent:#6C4732;--input:rgba(255,255,255,.58);--control-border:rgba(108,71,50,.38);--deco:#6C4732}
:root[data-theme="dark"]{color-scheme:dark;--bg:#171b25;--ink:#e7e9ee;--muted:#a5aab5;--accent:#91aaff;--input:rgba(30,34,43,.58);--control-border:rgba(255,255,255,.2);--deco:#596170}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:30px 15px 42px;color:var(--ink);font-family:GenEi,system-ui,sans-serif;background:var(--bg);transition:background .28s,color .28s}
main{max-width:600px;margin:auto}
.topbar{position:relative;left:50%;width:min(920px,calc(100vw - 32px));transform:translateX(-50%);display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}
.brand{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;letter-spacing:.04em;color:inherit;text-decoration:none}.brand-mark{width:17px;height:17px;flex:none}
.theme-toggle{display:grid;place-items:center;width:32px;height:32px;padding:0;border:1px solid var(--control-border);border-radius:50%;background:rgba(255,255,255,.48);color:var(--ink);cursor:pointer;transition:background .5s,border-color .5s,color .5s,transform .25s}
:root[data-theme="dark"] .theme-toggle{background:rgba(145,170,255,.12);border-color:rgba(145,170,255,.35);color:#cbd8ff}
.theme-toggle:active{transform:scale(.92)}.theme-toggle svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:30px;margin:7px 0;font-weight:700}.sub{color:var(--muted);font-size:13px;line-height:1.7;margin:0 0 22px}
.card{position:relative;isolation:isolate;margin:13px 0;padding:19px;background:transparent}
.card:before,.card:after{content:"";position:absolute;z-index:0;pointer-events:none;transition:all .32s ease-out}
.card:before{top:-6px;bottom:-6px;left:0;right:0;border-left:2px solid var(--deco);border-right:2px solid var(--deco)}
.card:after{top:0;bottom:0;left:-6px;right:-6px;border-top:2px solid var(--deco);border-bottom:2px solid var(--deco)}
.card>*{position:relative;z-index:1}
h2{font-size:16px;margin:0 8px 15px}
label{display:block;font-size:13px;font-weight:650;color:var(--muted);margin:0 8px 9px}
textarea{display:block;width:100%;margin:0;min-height:260px;resize:vertical;padding:15px;border:1px solid var(--control-border);border-radius:12px;background:var(--input);color:var(--ink);font:inherit;font-size:15px;line-height:1.9;outline:none;transition:border-color .2s,background .28s,color .28s}
textarea:focus{border-color:var(--accent);outline:2px solid color-mix(in srgb,var(--accent) 18%,transparent)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 8px 0}
button{font:inherit;cursor:pointer;transition:background .2s,color .2s,border-color .2s,transform .15s}
button:active{transform:scale(.98) translateY(1px)}
.primary{border:0;border-radius:11px;background:var(--accent);color:white;padding:13px;font-weight:750}
.secondary{border:1px solid var(--control-border);border-radius:11px;background:var(--input);color:var(--ink);padding:13px;font-weight:700}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.hint{font-size:13px;line-height:1.7;color:var(--muted);margin:11px 8px 0}
.result-wrap{margin-top:20px}
.result{min-height:260px;background:var(--input)}
.message{min-height:1.5em;color:var(--muted);font-size:12px;margin:11px 8px 0}
footer{color:var(--muted);font-size:11px;text-align:center;margin-top:42px}
@media(max-width:390px){h1{font-size:26px}.card{padding-left:2px;padding-right:2px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style>
</head>
<body>
<main>
<header>
<div class="topbar">
<a class="brand" href="https://niyaaari.github.io/" aria-label="kubearma サービス一覧へ">
<svg class="brand-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.581 9.986a.27.27 0 0 0-.291-.355l-5.055.72a.27.27 0 0 0-.229.326a.27.27 0 0 0 .07.13l3.6 3.716a.266.266 0 0 0 .378.013a.3.3 0 0 0 .071-.12zM6.745 20.393a.265.265 0 0 0 .376.317l4.727-2.244a.27.27 0 0 1 .222 0l4.94 2.24a.27.27 0 0 0 .365-.334c-.932-2.806-1.774-5.58-2.674-8.38a.265.265 0 0 0-.476-.053l-1.996 3.578a.27.27 0 0 1-.238.138h-.085a.26.26 0 0 1-.232-.143L9.736 11.95a.27.27 0 0 0-.233-.143h-.026a.265.265 0 0 0-.26.19a244 244 0 0 0-2.472 8.396m10.093-6.056a.264.264 0 0 0 .445.106l3.636-3.636a.271.271 0 0 0-.153-.461l-5.029-.704a.27.27 0 0 0-.296.35z"/><path fill="currentColor" d="M14.024 9.551a.32.32 0 0 0 0-.248l-.027-.064l-1.784-5.78a.265.265 0 0 0-.513 0l-1.747 5.78l-.026.085a.3.3 0 0 0 .01.201l1.731 3.991a.28.28 0 0 0 .244.16h.063a.27.27 0 0 0 .244-.16l1.8-3.965z"/></svg>
<span>kubearma</span></a>
<button class="theme-toggle" id="themeToggle" type="button" aria-label="テーマを切り替え" title="テーマを切り替え"><svg id="themeIcon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg></button>
</div>
<h1>どこでも改行くん</h1>
<p class="sub">改行したい位置を、特殊文字「 」にかんたん変換。文章を入力して変換ボタンを押すだけです。</p>
</header>
<section class="card">
<h2>01　文章を入力</h2>
<label for="sourceText">改行したい位置で、入力欄内でも改行してください。</label>
<textarea id="sourceText" placeholder="例：
あ
あ"></textarea>
<div class="actions">
<button class="primary" id="convertButton" type="button">変換する</button>
<button class="secondary" id="clearButton" type="button">入力をクリア</button>
</div>
<p class="hint">入力欄での改行位置が、特殊文字「 」に置き換わります。</p>
</section>
<section class="card result-wrap">
<h2>02　変換結果</h2>
<label for="resultText">変換後の文章</label>
<textarea class="result" id="resultText" readonly placeholder="ここに変換結果が表示されます。"></textarea>
<div class="actions">
<button class="primary" id="copyButton" type="button">結果をコピー</button>
<button class="secondary" id="selectButton" type="button">結果を選択</button>
</div>
<p class="message" id="message" aria-live="polite"></p>
</section>

</main>
<script>
const root=document.documentElement;
const themeButton=document.getElementById('themeToggle');
function applyTheme(theme){root.dataset.theme=theme;try{localStorage.setItem('pantaro_theme',theme)}catch(e){};const dark=theme==='dark';themeButton.setAttribute('aria-label',dark?'ライトモードに切り替え':'ナイトモードに切り替え');document.getElementById('themeIcon').innerHTML=dark?'<path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/><path d="M16 3v4m-2-2h4"/>':'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>'}
let saved='light';try{saved=localStorage.getItem('pantaro_theme')||'light'}catch(e){}applyTheme(saved);
themeButton.addEventListener('click',()=>applyTheme(root.dataset.theme==='dark'?'light':'dark'));
const source=document.getElementById('sourceText'),result=document.getElementById('resultText'),message=document.getElementById('message');
document.getElementById('convertButton').addEventListener('click',()=>{result.value=source.value.replace(/\r\n|\r|\n/g,'\u2028');message.textContent='変換しました！';});
document.getElementById('clearButton').addEventListener('click',()=>{source.value='';result.value='';message.textContent='入力内容をクリアしました。';source.focus()});
document.getElementById('copyButton').addEventListener('click',async()=>{if(!result.value){message.textContent='先に文章を変換してください。';return}try{await navigator.clipboard.writeText(result.value);message.textContent='変換結果をコピーしました！'}catch(e){result.focus();result.select();message.textContent='コピーできませんでした。結果を選択したので、手動でコピーしてください。'}});
document.getElementById('selectButton').addEventListener('click',()=>{if(!result.value){message.textContent='先に文章を変換してください。';return}result.focus();result.select();message.textContent='変換結果を選択しました。'});
</script>
</body>
</html>
