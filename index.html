<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#E9E2D0">
  <title>kubearma - サービス一覧</title>
  <style>
    @font-face{font-family:GenEi;src:url('https://raw.githubusercontent.com/niyaaari/part-time-pay-calculator/main/fonts/GenEiMGothic2-Regular.ttf')} 
    @font-face{font-family:GenEi;src:url('https://raw.githubusercontent.com/niyaaari/part-time-pay-calculator/main/fonts/GenEiMGothic2-Medium.ttf');font-weight:500}
    @font-face{font-family:GenEi;src:url('https://raw.githubusercontent.com/niyaaari/part-time-pay-calculator/main/fonts/GenEiMGothic2-Bold.ttf');font-weight:700}
    :root{color-scheme:light;--bg:#E9E2D0;--text:#6C4732;--muted:#806a5c;--panel:transparent;--theme-button:rgba(255,255,255,.48);--border:#6C4732;--deco:#6C4732;--accent:#6C4732;--shadow:none;--control-border:rgba(108,71,50,.35)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:GenEi,'Yu Gothic',sans-serif;color:var(--text);background:var(--bg);transition:background .25s,color .25s}
    body.dark{color:#e7e9ee;background:#171b25;--bg:#171b25;--text:#e7e9ee;--muted:#a5aab5;--panel:rgba(43,46,56,.76);--theme-button:rgba(255,255,255,.09);--border:rgba(255,255,255,.12);--deco:#596170;--accent:#91aaff;--shadow:0 14px 38px rgba(0,0,0,.22);--control-border:rgba(255,255,255,.2);color-scheme:dark}
    .page{width:min(920px,calc(100% - 32px));margin:0 auto;padding:30px 0 56px}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:52px}
    .brand{display:inline-flex;align-items:center;gap:7px;font-size:19px;font-weight:700;letter-spacing:.04em;color:inherit;text-decoration:none}.brand-mark{display:block;width:23px;height:23px;flex:none}
    .theme{display:grid;place-items:center;width:40px;height:40px;padding:0;border:1px solid var(--control-border);border-radius:999px;background:var(--theme-button);color:var(--text);cursor:pointer;position:relative;isolation:isolate;overflow:hidden;transition:background-color .2s,color .2s,border-color .2s,transform .15s}.theme svg{display:block;width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
    .theme:active{transform:scale(.98) translateY(1px)}.theme::after{content:"";position:absolute;inset:0;border:1px solid currentColor;border-radius:inherit;opacity:0;pointer-events:none;transition:opacity .25s}.theme:hover::after,.theme:focus-visible::after{opacity:.38}.theme:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
    .hero{text-align:center;margin-bottom:42px}
    .eyebrow{font-size:13px;letter-spacing:.18em;color:var(--muted);margin-bottom:12px}
    h1{font-size:clamp(34px,7vw,54px);margin:0;font-weight:700;letter-spacing:.04em}
    .subtitle{color:var(--muted);font-size:14px;margin:15px 0 0}
    .section-title{font-size:17px;font-weight:700;margin:0 0 16px 4px}
    .services{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
    .service{display:flex;flex-direction:column;min-height:210px;padding:25px 24px 21px;border:0;border-radius:0;background:transparent;box-shadow:none;color:var(--text);text-decoration:none;position:relative;isolation:isolate;transition:transform .35s cubic-bezier(.2,.9,.4,1.1),background-color .35s,color .35s;outline:none}
    .service::before,.service::after{content:"";position:absolute;pointer-events:none;z-index:0;transition:all .32s ease-out}
    .service::before{top:-6px;bottom:-6px;left:0;right:0;border-left:2px solid var(--deco);border-right:2px solid var(--deco)}
    .service::after{top:0;bottom:0;left:-6px;right:-6px;border-top:2px solid var(--deco);border-bottom:2px solid var(--deco)}
    .service>*{position:relative;z-index:1}
    .service:hover,.service:focus-visible{background-color:rgba(108,71,50,.08);color:var(--text);transform:scale(.995)}
    .service:hover::before,.service:focus-visible::before{top:0;bottom:0}
    .service:hover::after,.service:focus-visible::after{left:0;right:0}
    .service:hover p,.service:focus-visible p{color:var(--muted)} .service:hover .open,.service:focus-visible .open{color:var(--accent)}
    .service:focus-visible{outline:2px solid #6C4732;outline-offset:5px}
    .service:hover .status,.service:focus-visible .status{color:#4b8b73;background:rgba(105,190,151,.15)}
    @media(prefers-reduced-motion:reduce){.service,.service::before,.service::after{transition:none}.service:hover,.service:focus-visible{transform:none}}
    .service-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
    .service-icon{width:45px;height:45px;display:grid;place-items:center;border:1px solid #6C4732;border-radius:15px;background:transparent}.service-icon svg{stroke:#6C4732}.service-icon svg{width:25px;height:25px;display:block}
    .status{font-size:11px;color:#4b8b73;background:rgba(105,190,151,.15);padding:5px 10px;border-radius:999px;white-space:nowrap}
    .service h2{font-size:21px;margin:0 0 9px;font-weight:700}
    .service p{font-size:13px;line-height:1.8;color:var(--muted);margin:0}
    .open{margin-top:auto;padding-top:19px;color:var(--accent);font-size:13px;font-weight:700}
    footer{text-align:center;color:var(--muted);font-size:11px;margin-top:52px}
    @media(max-width:600px){.page{padding-top:22px}header{margin-bottom:42px}.services{grid-template-columns:1fr;gap:14px}.service{min-height:185px;padding:22px}.hero{margin-bottom:34px}}
  </style>
</head>
<body>
  <main class="page">
    <header>
      <a class="brand" href="./"><svg class="brand-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.581 9.986a.27.27 0 0 0-.291-.355l-5.055.72a.27.27 0 0 0-.229.326a.27.27 0 0 0 .07.13l3.6 3.716a.266.266 0 0 0 .378.013a.3.3 0 0 0 .071-.12zM6.745 20.393a.265.265 0 0 0 .376.317l4.727-2.244a.27.27 0 0 1 .222 0l4.94 2.24a.27.27 0 0 0 .365-.334c-.932-2.806-1.774-5.58-2.674-8.38a.265.265 0 0 0-.476-.053l-1.996 3.578a.27.27 0 0 1-.238.138h-.085a.26.26 0 0 1-.232-.143L9.736 11.95a.27.27 0 0 0-.233-.143h-.026a.265.265 0 0 0-.26.19a244 244 0 0 0-2.472 8.396m10.093-6.056a.264.264 0 0 0 .445.106l3.636-3.636a.271.271 0 0 0-.153-.461l-5.029-.704a.27.27 0 0 0-.296.35z"/><path fill="currentColor" d="M14.024 9.551a.32.32 0 0 0 0-.248l-.027-.064l-1.784-5.78a.265.265 0 0 0-.513 0l-1.747 5.78l-.026.085a.3.3 0 0 0 .01.201l1.731 3.991a.28.28 0 0 0 .244.16h.063a.27.27 0 0 0 .244-.16l1.8-3.965z"/></svg><span>kubearma</span></a>
      <button class="theme" id="themeToggle" type="button" aria-label="ナイトモードに切り替え"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg></button>
    </header>
    <section class="hero">
      <h1>くま</h1>
      <p class="subtitle">便利ツールくん</p>
    </section>
    <section>
      <h2 class="section-title">サービス一覧</h2>
      <div class="services">
        <a class="service" href="https://niyaaari.github.io/part-time-pay-calculator/">
          <div class="service-top"><div class="service-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#6C4732" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg></div><span class="status">公開中</span></div>
          <h2>給料計算くん</h2>
          <p>勤務時間や時給から、給料をかんたん計算。日々の勤務記録や月ごとの合計も管理できます。</p>
          <div class="open">サービスを開く →</div>
        </a>
        <a class="service" href="https://niyaaari.github.io/character-counter/">
          <div class="service-top"><div class="service-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg></div><span class="status">公開中</span></div>
          <h2>文字数カウントくん</h2>
          <p>文章の文字数や空白を除いた文字数をリアルタイムでカウント。目標文字数の確認にも使えます。</p>
          <div class="open">サービスを開く →</div>
        </a>
      </div>
    </section>
    <footer>© kubearma</footer>
  </main>
  <script>
    const button=document.getElementById('themeToggle');
    const saved=localStorage.getItem('pantaro_theme')||localStorage.getItem('pantaro_portal_theme')||'light';
    if(saved==='dark')document.body.classList.add('dark');
    function updateButton(){const dark=document.body.classList.contains('dark');button.innerHTML=dark?'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>':'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>';button.setAttribute('aria-label',dark?'ライトモードに切り替え':'ナイトモードに切り替え')}
    updateButton();
    button.addEventListener('click',()=>{document.body.classList.toggle('dark');localStorage.setItem('pantaro_theme',document.body.classList.contains('dark')?'dark':'light');updateButton()});
  </script>
</body>
</html>
